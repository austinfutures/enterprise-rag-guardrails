[project]
name = "enterprise-rag-guardrails"
version = "1.0.0"
description = "Hybrid RAG with document intelligence, guardrails and an automated evaluation harness."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
